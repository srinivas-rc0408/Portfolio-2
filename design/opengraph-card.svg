<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Depth on a TRUE-BLACK field: a faint white spotlight, no colour cast. -->
    <radialGradient id="spot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.028"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Bolt: near-solid white with a whisper of falloff so it reads as metal,
         not flat paint. -->
    <linearGradient id="bolt" x1="0" y1="3" x2="0" y2="37" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#fbfcfe"/>
      <stop offset="1" stop-color="#e3e8f0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="halo" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="10" result="a"/>
      <feMerge><feMergeNode in="a"/><feMergeNode in="a"/><feMergeNode in="a"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.026" stroke-width="1"/>
    </pattern>
    <!-- CRT scanlines — invisible at a glance, felt as texture up close. -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" fill-opacity="0.014"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#000000"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="302" cy="330" rx="392" ry="352" fill="url(#spot)"/>
  <rect width="1200" height="630" fill="url(#scan)"/>
  <rect x="20" y="20" width="1160" height="590" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>

  <!-- Window chrome — the site's own traffic-lights + host prompt. -->
  <g>
    <circle cx="62" cy="66" r="9" fill="#ff5f57"/>
    <circle cx="92" cy="66" r="9" fill="#2fd84f"/>
    <circle cx="122" cy="66" r="9" fill="#4aa8ff"/>
    <text x="152" y="73" font-family="Noto Sans Mono" font-weight="500" font-size="22"
          fill="#ffffff" fill-opacity="0.34">srinivas@rc:~</text>
  </g>

  <!-- The mark. Glow is cast from the FILLED silhouette (an energy bloom, ref 1)
       rather than a stroked ring — a stroke read as a muddy grey band against
       true black. Core stays a crisp, unbroken white edge. -->
  <g transform="translate(300,322) scale(11.2) translate(-19,-20)">
    <path d="M29 3 H14 L9 17 H19 L7 37 L31 15 H20 L29 3 Z"
          fill="#ffffff" filter="url(#halo)" opacity="0.26"/>
    <path d="M29 3 H14 L9 17 H19 L7 37 L31 15 H20 L29 3 Z" fill="url(#bolt)"/>
  </g>

  <!-- Identity. Baselines pulled up ~28px so the block's optical centre sits
       with the bolt's rather than hanging below it. -->
  <g font-family="Noto Sans Mono">
    <text x="540" y="226" font-weight="500" font-size="30" letter-spacing="4" fill="#5aa2ff">&gt; whoami</text>
    <text x="538" y="326" font-weight="800" font-size="90" letter-spacing="-1.5" fill="#ffffff">Srinivas RC</text>
    <text x="540" y="398" font-weight="500" font-size="46" fill="#ffffff" fill-opacity="0.68">AI / ML Engineer</text>
    <rect x="540" y="436" width="600" height="2" fill="url(#rule)"/>
    <!-- Cursor is a FULL BLOCK glyph inside the run, so mono metrics place it
         after the final "v" automatically — it can never overlap the text. -->
    <text x="540" y="498" font-weight="500" font-size="30" fill="#ffffff" fill-opacity="0.42"
      >srinivas-rc.is-a.dev<tspan fill="#5aa2ff" fill-opacity="0.95">&#9608;</tspan></text>
  </g>
</svg>
